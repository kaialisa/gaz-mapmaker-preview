<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Neptune</title>
    <style>
      :root {
        --bg: #0b0d1c;
        --panel: #14172b;
        --border: #343a63;
        --text: #dfe4ff;
        --muted: #8b92c2;
        --accent: #ff6fa8;
        --danger: #ff8a8a;
      }
      [hidden] { display: none !important; }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
      #unity-container { position: relative; width: 100%; height: calc(100vh - 230px); min-height: 480px; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #000; }
      #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
      .page-panel { max-width: 1600px; margin: 12px auto 24px; padding: 0 16px; box-sizing: border-box; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
      .actions label { color: var(--muted); margin-right: auto; }
      button, .file-button { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
      button:hover, .file-button:hover { border-color: var(--accent); }
      button:disabled { opacity: 0.4; cursor: default; border-color: var(--border); }
      button.primary { border-color: var(--accent); color: var(--accent); }
      .file-button input { display: none; }
      textarea { width: 100%; height: 160px; box-sizing: border-box; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-family: ui-monospace, monospace; font-size: 12px; resize: vertical; }

      details { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
      summary { padding: 10px 14px; cursor: pointer; color: var(--text); }
      summary span { color: var(--muted); margin-left: 8px; font-size: 13px; }
      .silhouette-body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px; }
      .previews { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      @media (max-width: 700px) { .previews { grid-template-columns: minmax(0, 1fr); } }
      .preview { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
      .preview-title { color: var(--muted); font-size: 13px; }
      .preview canvas { width: 100%; max-height: 360px; object-fit: contain; background: #000; border: 1px solid var(--border); border-radius: 6px; }
      #source-canvas { cursor: crosshair; background-image: linear-gradient(45deg, #1b1e36 25%, transparent 25%, transparent 75%, #1b1e36 75%), linear-gradient(45deg, #1b1e36 25%, transparent 25%, transparent 75%, #1b1e36 75%); background-size: 16px 16px; background-position: 0 0, 8px 8px; }
      .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 20px; align-items: center; }
      .slider { display: grid; grid-template-columns: 8em minmax(0, 1fr) 3em; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
      .slider output { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
      .slider input { width: 100%; accent-color: var(--accent); }
      .check { color: var(--muted); font-size: 14px; display: flex; gap: 8px; align-items: center; }
      .check input { accent-color: var(--accent); }
      .check select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font: inherit; }
      .swatches { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
      .swatches i { width: 16px; height: 16px; border: 1px solid var(--border); border-radius: 3px; display: inline-block; }
      #silhouette-status { min-height: 1.4em; color: var(--muted); font-size: 14px; }
      #silhouette-status.error { color: var(--danger); }
      #silhouette-status.ready { color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading">Loading…</div>
    </div>

    <div class="page-panel" id="silhouette-section" hidden>
      <details id="silhouette-panel">
        <summary>Shape from image<span>Turn any picture into a map shape</span></summary>
        <div class="silhouette-body">
          <div class="actions">
            <label>Load a picture. Click its background to mark colors as empty space.</label>
            <label class="file-button">Open image<input type="file" id="image-file" accept="image/png,image/jpeg,image/webp,image/gif"></label>
            <button type="button" id="auto-detect" disabled>Detect background again</button>
            <button type="button" id="use-shape" class="primary" disabled>Use this shape</button>
          </div>
          <div class="previews">
            <div class="preview">
              <div class="preview-title">Original</div>
              <canvas id="source-canvas" width="256" height="256"></canvas>
            </div>
            <div class="preview">
              <div class="preview-title" id="mask-title">Silhouette</div>
              <canvas id="mask-canvas" width="256" height="256"></canvas>
            </div>
          </div>
          <div class="controls">
            <div class="slider"><span>Tolerance</span><input id="tolerance" type="range" min="5" max="160" value="60"><output id="tolerance-out">60</output></div>
            <div class="slider"><span>Smooth</span><input id="smooth" type="range" min="0" max="6" value="2"><output id="smooth-out">2</output></div>
            <label class="check"><input id="edges-only" type="checkbox" checked> Only background touching the edges</label>
            <label class="check"><input id="invert" type="checkbox"> Invert</label>
            <label class="check">Stars
              <select id="mode">
                <option value="filled">Fill the whole shape</option>
                <option value="outline">Follow the outline</option>
                <option value="shaded">Follow light and dark</option>
              </select>
            </label>
            <div class="slider" id="thickness-row" hidden><span>Thickness</span><input id="thickness" type="range" min="4" max="64" value="28"><output id="thickness-out">28</output></div>
            <label class="check" id="light-row" hidden><input id="light-dense" type="checkbox"> More stars in light areas</label>
            <div class="swatches" id="swatches"></div>
          </div>
          <div id="silhouette-status" role="status"></div>
        </div>
      </details>
    </div>

    <div class="page-panel">
      <div class="actions">
        <label for="jsonout">Map JSON: generated maps appear here, and Import JSON reads from here</label>
        <label class="file-button">Open file<input type="file" id="json-file" accept=".json,.txt"></label>
        <button type="button" id="copy-json">Copy</button>
        <button type="button" id="download-json">Download</button>
      </div>
      <textarea id="jsonout" spellcheck="false"></textarea>
    </div>

    <script>
      var jsonBox = document.getElementById("jsonout");

      document.getElementById("copy-json").onclick = function () {
        navigator.clipboard.writeText(jsonBox.value);
      };

      document.getElementById("download-json").onclick = function () {
        var blob = new Blob([jsonBox.value], { type: "application/json" });
        var link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "galaxy.json";
        link.click();
        URL.revokeObjectURL(link.href);
      };

      document.getElementById("json-file").onchange = function (event) {
        var file = event.target.files[0];
        if (!file) {
          return;
        }
        file.text().then(function (text) {
          jsonBox.value = text;
        });
        event.target.value = "";
      };
    </script>

    <script>
      (function () {
        var MaskSide = 256;
        var MaxFileBytes = 15 * 1024 * 1024;
        var MaxImageSide = 10000;
        var AllowedTypes = ["image/png", "image/jpeg", "image/webp", "image/gif"];
        var MaxPicks = 8;

        var sourceCanvas = document.getElementById("source-canvas");
        var sourceContext = sourceCanvas.getContext("2d", { willReadFrequently: true });
        var maskCanvas = document.getElementById("mask-canvas");
        var maskContext = maskCanvas.getContext("2d");
        var status = document.getElementById("silhouette-status");
        var autoButton = document.getElementById("auto-detect");
        var useButton = document.getElementById("use-shape");
        var tolerance = document.getElementById("tolerance");
        var smooth = document.getElementById("smooth");
        var edgesOnly = document.getElementById("edges-only");
        var invert = document.getElementById("invert");
        var mode = document.getElementById("mode");
        var thickness = document.getElementById("thickness");
        var lightDense = document.getElementById("light-dense");
        var levels = null;

        var width = 0;
        var height = 0;
        var pixels = null;
        var backgroundColors = [];
        var mask = null;
        var redrawQueued = false;

        window.mapmakerSilhouette = null;

        function setStatus(text, kind) {
          status.textContent = text;
          status.className = kind || "";
        }

        document.getElementById("image-file").onchange = function (event) {
          var file = event.target.files[0];
          event.target.value = "";
          if (!file) {
            return;
          }
          if (AllowedTypes.indexOf(file.type) === -1) {
            setStatus("This file type isn't supported. Use a PNG, JPEG, WebP or GIF image.", "error");
            return;
          }
          if (file.size > MaxFileBytes) {
            setStatus("This image is larger than 15 MB. Save a smaller version and try again.", "error");
            return;
          }
          setStatus("Loading image…");
          createImageBitmap(file).then(function (bitmap) {
            if (bitmap.width > MaxImageSide || bitmap.height > MaxImageSide) {
              bitmap.close();
              setStatus("This image is wider or taller than 10,000 pixels. Save a smaller version and try again.", "error");
              return;
            }
            loadBitmap(bitmap);
            bitmap.close();
            setStatus("Check the silhouette, adjust it if needed, then press Use this shape.");
          }).catch(function () {
            setStatus("This image couldn't be read. Try saving it again as a PNG or JPEG.", "error");
          });
        };

        function loadBitmap(bitmap) {
          var scale = MaskSide / Math.max(bitmap.width, bitmap.height);
          width = Math.max(1, Math.round(bitmap.width * scale));
          height = Math.max(1, Math.round(bitmap.height * scale));
          sourceCanvas.width = maskCanvas.width = width;
          sourceCanvas.height = maskCanvas.height = height;
          sourceContext.clearRect(0, 0, width, height);
          sourceContext.drawImage(bitmap, 0, 0, width, height);
          pixels = sourceContext.getImageData(0, 0, width, height).data;
          autoButton.disabled = false;
          useButton.disabled = false;
          detectBackground();
        }

        function detectBackground() {
          var counts = new Map();
          var samples = 0;
          function sample(x, y) {
            var i = (y * width + x) * 4;
            if (pixels[i + 3] < 128) {
              return;
            }
            samples++;
            var key = (pixels[i] >> 4) + "," + (pixels[i + 1] >> 4) + "," + (pixels[i + 2] >> 4);
            var entry = counts.get(key) || { n: 0, r: 0, g: 0, b: 0 };
            entry.n++;
            entry.r += pixels[i];
            entry.g += pixels[i + 1];
            entry.b += pixels[i + 2];
            counts.set(key, entry);
          }
          for (var x = 0; x < width; x++) { sample(x, 0); sample(x, height - 1); }
          for (var y = 0; y < height; y++) { sample(0, y); sample(width - 1, y); }

          backgroundColors = [];
          var sorted = Array.from(counts.values()).sort(function (a, b) { return b.n - a.n; });
          for (var k = 0; k < sorted.length && backgroundColors.length < 3; k++) {
            if (sorted[k].n / samples < 0.08 && backgroundColors.length > 0) {
              break;
            }
            backgroundColors.push([sorted[k].r / sorted[k].n, sorted[k].g / sorted[k].n, sorted[k].b / sorted[k].n]);
          }
          renderSwatches();
          queueRedraw();
        }

        function renderSwatches() {
          var box = document.getElementById("swatches");
          box.replaceChildren();
          var label = document.createElement("span");
          label.textContent = backgroundColors.length ? "Background:" : "Background: transparent pixels";
          box.appendChild(label);
          backgroundColors.forEach(function (color) {
            var swatch = document.createElement("i");
            swatch.style.background = "rgb(" + color.map(Math.round).join(",") + ")";
            box.appendChild(swatch);
          });
        }

        sourceCanvas.onclick = function (event) {
          if (!pixels) {
            return;
          }
          var rect = sourceCanvas.getBoundingClientRect();
          var x = Math.min(width - 1, Math.floor((event.clientX - rect.left) / rect.width * width));
          var y = Math.min(height - 1, Math.floor((event.clientY - rect.top) / rect.height * height));
          var i = (y * width + x) * 4;
          if (pixels[i + 3] < 128) {
            return;
          }
          if (backgroundColors.length >= MaxPicks) {
            backgroundColors.shift();
          }
          backgroundColors.push([pixels[i], pixels[i + 1], pixels[i + 2]]);
          renderSwatches();
          queueRedraw();
        };

        autoButton.onclick = detectBackground;
        [tolerance, smooth, thickness].forEach(function (input) {
          input.oninput = function () {
            document.getElementById(input.id + "-out").textContent = input.value;
            queueRedraw();
          };
        });
        edgesOnly.onchange = queueRedraw;
        invert.onchange = queueRedraw;
        lightDense.onchange = queueRedraw;
        mode.onchange = function () {
          document.getElementById("thickness-row").hidden = mode.value !== "outline";
          document.getElementById("light-row").hidden = mode.value !== "shaded";
          queueRedraw();
        };

        function queueRedraw() {
          if (redrawQueued) {
            return;
          }
          redrawQueued = true;
          requestAnimationFrame(function () {
            redrawQueued = false;
            computeMask();
          });
        }

        function isBackground(index, limit) {
          var i = index * 4;
          if (pixels[i + 3] < 128) {
            return true;
          }
          for (var c = 0; c < backgroundColors.length; c++) {
            var color = backgroundColors[c];
            var dr = pixels[i] - color[0];
            var dg = pixels[i + 1] - color[1];
            var db = pixels[i + 2] - color[2];
            if (dr * dr + dg * dg + db * db < limit) {
              return true;
            }
          }
          return false;
        }

        function computeMask() {
          if (!pixels) {
            return;
          }
          var count = width * height;
          var limit = Number(tolerance.value) * Number(tolerance.value);
          var background = new Uint8Array(count);

          if (edgesOnly.checked) {
            var stack = [];
            var seed = function (x, y) {
              var index = y * width + x;
              if (!background[index] && isBackground(index, limit)) {
                background[index] = 1;
                stack.push(index);
              }
            };
            for (var x = 0; x < width; x++) { seed(x, 0); seed(x, height - 1); }
            for (var y = 0; y < height; y++) { seed(0, y); seed(width - 1, y); }
            while (stack.length) {
              var index = stack.pop();
              var px = index % width;
              var py = (index - px) / width;
              if (px > 0) seed(px - 1, py);
              if (px < width - 1) seed(px + 1, py);
              if (py > 0) seed(px, py - 1);
              if (py < height - 1) seed(px, py + 1);
            }
          }
          else {
            for (var i = 0; i < count; i++) {
              background[i] = isBackground(i, limit) ? 1 : 0;
            }
          }

          mask = new Uint8Array(count);
          for (var j = 0; j < count; j++) {
            mask[j] = background[j] ? 0 : 1;
          }
          for (var pass = 0; pass < Number(smooth.value); pass++) {
            mask = majority(mask);
          }
          if (invert.checked) {
            for (var k = 0; k < count; k++) {
              mask[k] ^= 1;
            }
          }
          levels = computeLevels();
          drawMask();
        }

        function computeLevels() {
          var count = width * height;
          var result = new Uint8Array(count);
          var i;
          if (mode.value === "outline") {
            var distance = edgeDistance();
            var band = Number(thickness.value);
            for (i = 0; i < count; i++) {
              result[i] = mask[i] && distance[i] <= band ? 9 : 0;
            }
          }
          else if (mode.value === "shaded") {
            var lightness = new Float32Array(count);
            var darkest = 1;
            var lightest = 0;
            for (i = 0; i < count; i++) {
              if (!mask[i]) {
                continue;
              }
              var p = i * 4;
              lightness[i] = (0.299 * pixels[p] + 0.587 * pixels[p + 1] + 0.114 * pixels[p + 2]) / 255;
              darkest = Math.min(darkest, lightness[i]);
              lightest = Math.max(lightest, lightness[i]);
            }
            var range = Math.max(0.001, lightest - darkest);
            for (i = 0; i < count; i++) {
              if (!mask[i]) {
                continue;
              }
              var stretched = (lightness[i] - darkest) / range;
              var weight = lightDense.checked ? stretched : 1 - stretched;
              result[i] = 1 + Math.round(weight * 8);
            }
          }
          else {
            for (i = 0; i < count; i++) {
              result[i] = mask[i] ? 9 : 0;
            }
          }
          return result;
        }

        function edgeDistance() {
          var distance = new Float32Array(width * height);
          for (var i = 0; i < distance.length; i++) {
            distance[i] = mask[i] ? 1e9 : 0;
          }
          function at(x, y) {
            return x < 0 || y < 0 || x >= width || y >= height ? 0 : distance[y * width + x];
          }
          function relax(x, y, neighbors) {
            var index = y * width + x;
            if (distance[index] === 0) {
              return;
            }
            var best = distance[index];
            for (var n = 0; n < neighbors.length; n++) {
              var step = neighbors[n];
              best = Math.min(best, at(x + step[0], y + step[1]) + step[2]);
            }
            distance[index] = best;
          }
          var forward = [[-1, 0, 1], [0, -1, 1], [-1, -1, 1.414], [1, -1, 1.414]];
          var backward = [[1, 0, 1], [0, 1, 1], [1, 1, 1.414], [-1, 1, 1.414]];
          for (var y = 0; y < height; y++) {
            for (var x = 0; x < width; x++) {
              relax(x, y, forward);
            }
          }
          for (var y2 = height - 1; y2 >= 0; y2--) {
            for (var x2 = width - 1; x2 >= 0; x2--) {
              relax(x2, y2, backward);
            }
          }
          return distance;
        }

        function majority(source) {
          var result = new Uint8Array(width * height);
          for (var y = 0; y < height; y++) {
            for (var x = 0; x < width; x++) {
              var sum = 0;
              for (var dy = -2; dy <= 2; dy++) {
                var row = Math.min(height - 1, Math.max(0, y + dy)) * width;
                for (var dx = -2; dx <= 2; dx++) {
                  sum += source[row + Math.min(width - 1, Math.max(0, x + dx))];
                }
              }
              result[y * width + x] = sum > 12 ? 1 : 0;
            }
          }
          return result;
        }

        function drawMask() {
          var image = maskContext.createImageData(width, height);
          var filled = 0;
          for (var i = 0; i < levels.length; i++) {
            var value = Math.round(levels[i] / 9 * 255);
            filled += levels[i] > 0 ? 1 : 0;
            image.data[i * 4] = value;
            image.data[i * 4 + 1] = value;
            image.data[i * 4 + 2] = value;
            image.data[i * 4 + 3] = 255;
          }
          maskContext.putImageData(image, 0, 0);
          var percent = Math.round(filled / levels.length * 100);
          document.getElementById("mask-title").textContent = "Silhouette · " + percent + "% filled";
          useButton.disabled = filled === 0;
        }

        useButton.onclick = function () {
          if (!levels) {
            return;
          }
          window.mapmakerSilhouette = { width: width, height: height, mask: levels.slice() };
          setStatus("Shape saved. Scroll up and press Generate map.", "ready");
        };
      })();
    </script>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/WebBuild.data",
        frameworkUrl: buildUrl + "/WebBuild.framework.js",
        codeUrl: buildUrl + "/WebBuild.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Neptune",
        productVersion: "0.1.0",
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/WebBuild.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          loading.textContent = "Loading " + Math.round(progress * 100) + "%";
        }).then(function () {
          loading.style.display = "none";
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
